<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="location" content="Santa Monica, California">
    <meta name="keywords" content="poem">
    <title>sun salutation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        background-color: whitesmoke;
      }

      #text {
        font-family: monospace;
        font-size: 16px;
        line-height: 32px;
        text-align: left;
        padding: 16px;
      }

      p {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>

  <body>
    <div id="text">
      <p>aptly, the</p>
      <p>hummingbird</p>
      <p>begins the day</p>
      <p>perched on</p>
      <p>the high-speed</p>
      <p>cable strung</p>
      <p>across our yard,</p>
      <p>soaking in</p>
      <p>the morning rays,</p>
      <p>electrified</p>
      <p>by the physical</p>
      <p>limits of light.</p>
    </div>
  </body>

</html>
